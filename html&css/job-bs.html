<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="icon" href="/images/form.png">
    <title>bs-Job application form</title>
</head>

<body>
    <div class="container mt-3">

        <form action="" method="post" enctype="multipart/form-data" class="p-3 rounded border bg-white mx-auto" style="max-width: 400px; width: 100%;">
            
            <h2 class="mb-3">Job Application</h2> 

            <div class="mb-3">
                <label for="fullName" class="form-label">Full Name</label>
                <input class="form-control" type="text" id="fullName" name="fullName" minlength="3" maxlength="50" placeholder="e.g. Dylan Joy" autocomplete="name" autocapitalize="words" spellcheck="false" pattern="[a-zA-Z\s]+" title="Only letters and spaces allowed" required>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input class="form-control" type="email" id="email" name="email" maxlength="100" placeholder="name@example.com" autocomplete="email" spellcheck="false" required>
            </div>

            <div class="mb-3">
                <label for="phone" class="form-label">Phone Number</label>
                <input class="form-control" type="tel" id="phone" name="phone" pattern="[0-9]{10}" maxlength="10" inputmode="numeric" placeholder="10-digit number" autocomplete="tel" title="Please enter a valid 10-digit phone number" required>
            </div>

            <div class="mb-3">
                <label for="resume" class="form-label">Attach resume</label>
                <input class="form-control" type="file" id="resume" name="resume" accept=".pdf,application/pdf" required>
            </div>

            <button type="submit" class="btn btn-primary w-75 d-block mx-auto">Submit</button>
            
        </form>

    </div>
</body>
</html>
