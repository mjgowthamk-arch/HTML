<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Details form</title>
    <link rel="icon" href="/images/form.png" type="image/png">
</head>
<body>

<header>
    <h1>Fill the form below:</h1>
</header>

<form action="/submit" method="POST" enctype="multipart/form-data">

    <label for="fname">First name:</label><br>
    <input type="text" id="fname" name="first_name"> 
    <br><br>

    <label for="lname">Last name:</label><br>
    <input type="text" id="lname" name="last_name"> 
    <br>

    <p>Gender:</p>
    
    <input type="radio" id="gender1" name="gender" value="Male"> 
    <label for="gender1">Male</label> 
    <br>

    <input type="radio" id="gender2" name="gender" value="Female">
    <label for="gender2">Female</label> 
    <br>

    <input type="radio" id="gender3" name="gender" value="Others">
    <label for="gender3">Others</label>
    <br><br>

    <label for="name1">Father name:</label><br>
    <input type="text" id="name1" name="father_name">
    <br><br>

    <label for="name2">Mother name:</label><br>
    <input type="text" id="name2" name="mother_name">
    <br><br>

    <label for="nation">Nationality:</label><br>
    <input type="text" id="nation" name="nationality"> 
    <br><br>

    <label for="dob">Date of birth:</label><br>
    <input type="date" id="dob" name="dob">
    <br><br>
    
    <label for="age">Age:</label><br>
    <input type="number" id="age" name="age">
    <br><br>

    <label for="group">Enter your blood group:</label><br>
    <input type="text" id="group" name="blood_group">
    <br><br>

    <label for="num1">Primary mobile number:</label><br>
    <input type="tel" id="num1" name="primary_phone"> 
    <br><br>

    <label for="num2">Emergency mobile number:</label><br>
    <input type="tel" id="num2" name="emergency_phone"> 
    <br><br>
    
    <label for="gmail">Enter your email id:</label><br>
    <input type="email" id="gmail" name="email"> 
    <br><br>

    <label for="addr">Address:</label><br>
    <input type="text" id="addr" name="address"> 
    <br><br>

    <label for="pin">Pin code:</label><br>
    <input type="text" id="pin" name="pincode" inputmode="numeric" pattern="[0-9]{6}"><br><br>

    <label for="acc">Bank account number:</label><br>
    <input type="text" id="acc" name="account_number" inputmode="numeric">
    <br><br>

    <p>Select your preferred domain:</p>

    <input type="checkbox" id="front" name="domain" value="Frontend">
    <label for="front">Frontend</label>
    <br>

    <input type="checkbox" id="back" name="domain" value="Backend">
    <label for="back">Backend</label>
    <br>
   
    <input type="checkbox" id="fullstack" name="domain" value="Full stack">
    <label for="fullstack">Full stack</label>
    <br><br> 

    <label for="resume1">Attach your resume:</label><br>
    <input type="file" id="resume1" name="resume">
    <br><br>

    <label for="idproof">Attach your Aadhaar copy:</label><br>
    <input type="file" id="idproof" name="aadhar_copy">
    <br><br>

    <label for="photo1">Attach your photo copy:</label><br>
    <input type="file" id="photo1" name="photo">
    <br><br>

    <a href="#" target="_blank">Terms and conditions</a>
    <br>
    <input type="checkbox" id="terms" name="terms" required> 
    <label for="terms">I agree with the terms and conditions</label>
    <br><br>
    
    <input type="submit" value="Submit"> 

</form>

<footer>
    <p>Contact us at <a href="mailto:support@example.com">support@example.com</a></p>
</footer>

</body>
</html>
