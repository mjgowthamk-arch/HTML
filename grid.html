<!DOCTYPE html>
<html lang="en">
    <head>
        
        <meta charset="UTF-8">
        <title>Grid</title>
        
    </head>
    
    <style>
        .container {
            display: grid;
            grid-template-columns: auto auto auto;
            background-color: blue;
            padding: 10px;
        }

        .container div {
            background-color: aliceblue;
            border: 2px solid black;
            font-size: 30px;
            text-align: center;
            padding: 40px; 
                          
            /*  
            height: 100px;  
           
            display: grid;
            place-items: center;  or line-height: 100px; */
        }

    </style>

    <body>

        <h1>Grid Layout</h1>

        <div class="container">
            
            <div>1</div>
            <div>2</div>
            <div>3</div>
            <div>4</div>
            <div>5</div>
        
        </div>         
    
    </body>
    
</html>
