<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application form</title>
</head>
<style>

</style>
<body>
    <h2>Fill the Form below :</h2>
    <form action="">
        <fieldset>
            <legend>Personal info</legend>

            <label for="name">Enter your name:</label>
            <input type="text" name="fullname" id="name">
            <br><br>

            <label for="email">Enter your email:</label>
            <input type="email" name="mail" id="email">
            <br><br>

            <label for="phone">Enter your phone number:</label>
            <input type="number" name="phone" id="phone">
            <br><br>

            <label for="location">Enter your location:</label>
            <input type="text" name="location" id="location" placeholder="city">
            <br><br>

            <label for="linkedin">Linked in url:</label>
            <input type="url" name="link" id="link">
            <br><br>

        </fieldset><br>

        <fieldset>

            <legend>Experince</legend>

            <label for="exp">Total years of Experiance:</label>
            <input type="number" name="exp" id="exp">
            <br><br>

            <label for="title">Previous Job titles:</label>
            <input type="text" name="title" id="title">
            <br><br>

        </fieldset><br>

        <fieldset>
            <legend>Documents</legend>

            <label for="resume">Attach your resume:</label>
            <br><br>
            <input type="file" name="resume" id="resume">
            <br><br>

            <label for="id">Attach your Id proof:</label>
            <br><br>
            <input type="file" name="idproof" id="id">
            <br><br>


        </fieldset><br>
    


    </form>
    
</body>
</html>
