        Math.round
        Rounds to the nearest integer: 3.1 becomes 3, 3.6 becomes 4. In the middle cases 3.5 rounds up to 4, and -3.5 rounds up to -3.

        function divideNumbers(a, b) {
            if (Number.isNaN(a) || Number.isNaN(b)) {
                return "Invalid: One of the inputs is NaN!";
            }
            if (!Number.isFinite(a) || !Number.isFinite(b)) {
                return "Invalid: Inputs must be finite numbers!";
            }
            if (b === 0) {
                return "Invalid: Cannot divide by zero!";
            }
            return a / b;
        }

        // Map 

        // Map is a collection of keyed data items, just like an Object. But the main difference is that Map allows keys of any type.

        // Insertion order (first in, first out)

        // Map methods :

        const userRoles = new Map();

        // 2. map.set(key, value) – stores the value by the key
        userRoles.set("alice", "Admin");
        userRoles.set("bob", "Editor");

        // 3. map.get(key) – returns the value by the key, undefined if not found
        console.log(userRoles.get("alice"));   // "Admin"
        console.log(userRoles.get("charlie")); // undefined

        // 4. map.has(key) – returns true if the key exists, false otherwise
        console.log(userRoles.has("bob"));     // true
        console.log(userRoles.has("charlie")); // false

        // 5. map.size – returns the current element count
        console.log(userRoles.size);           // 2

        // 6. map.delete(key) – removes the element by the key
        userRoles.delete("bob");
        console.log(userRoles.has("bob"));     // false
        console.log(userRoles.size);           // 1

        // 7. map.clear() – removes everything from the map
        userRoles.clear();
        console.log(userRoles.size);           // 0

        const map4 = new Map(Object.entries(userObj)); // Object.entries() takes an object and returns an array of its own [key, value] pairs
        console.log(map4.get('name')); // "Bob"

        // ----------------------------------------

        // Map preserves key data types
        let map11 = new Map();
        map11.set('1', 'str1');   // string key
        map11.set(1, 'num1');     // numeric key (not converted to string!)
        map11.set(true, 'bool1'); // boolean key

        alert(map11.get(1));   // 'num1'
        alert(map11.get('1')); // 'str1'
        alert(map11.size);     // 3

        // ----------------------------------------

        // Plain Object fails with Object keys
        let john = { name: "John" };
        let ben = { name: "Ben" };
        let visitsCountObj = {};
        // When used as keys, both objects are stringified to "[object Object]"
        visitsCountObj[ben] = 234;  // visitsCountObj["[object Object]"] = 234
        visitsCountObj[john] = 123; // Overwrites the previous value!
        // Both access the same key:
        alert(visitsCountObj[ben]);              // 123
        alert(visitsCountObj["[object Object]"]); // 123

        // ----------------------------------------

        // The Fix using Map (Keeps Objects Distinct)
        let visitsCountMap = new Map();

        // Map stores objects by reference, NOT as strings
        visitsCountMap.set(ben, 234);
        visitsCountMap.set(john, 123);

        alert(visitsCountMap.get(ben));  // 234 (Kept intact!)
        alert(visitsCountMap.get(john)); // 123
        alert(visitsCountMap.size);      // 2
        
        // ----------------------------------------
        
        function bulkAdd(targetMap, pairs) {
            for (const [key, value] of pairs) {
                targetMap.set(key, value);
            }
            return targetMap; // allows method chaining if needed
        }

        // Usage:
        const map5 = new Map();
        const newItems = [
            ['x', 10],
            ['y', 20],
            ['z', 30]
        ];
        bulkAdd(map5, newItems);
        console.log(map5.size);     // 3
        console.log(map5.get('x')); // 10

        // ----------------------------------------
        
        const map6 = new Map();
        const entries = [
            ['user1', 'Alice'],
            ['user2', 'Bob'],
            ['user3', 'Charlie']
        ];
        for (const [key, value] of entries) {
            map6.set(key, value);
        }
        console.log(map6.size); // 3

        // ----------------------------------------

        const map7 = new Map();
        // Add 100 items dynamically:
        for (let i = 1; i <= 100; i++) {
            map7.set(`user_${i}`, { id: i, active: true });
        }
        console.log(map7.size); // 100

        // ----------------------------------------

        const config = { theme: 'dark', lang: 'en', auth: true };
        const map8 = new Map();
        for (const key in config) {
            map8.set(key, config[key]);
        }
        console.log(map8.get('theme')); // "dark"

        // Set

        // A Set is a special type collection – “set of values” (without keys), where each value may occur only once.

        // Set methods :

        // 1. new Set([iterable]) – creates the set and initializes it with values
        const fruitsSet1 = new Set(["apple", "banana", "orange"]);

        // 2. set.add(value) – adds a value, returns the set itself (ignores duplicates!)
        fruitsSet1.add("mango");
        fruitsSet1.add("apple"); // Ignored because "apple" is already in the set

        // 3. set.has(value) – returns true if the value exists, false otherwise
        console.log(fruitsSet1.has("banana"));   // true
        console.log(fruitsSet1.has("grapes"));   // false

        // 4. set.size – returns the current element count
        console.log(fruitsSet1.size);             // 4 (apple, banana, orange, mango)

        // 5. set.delete(value) – removes the value, returns true if found, false otherwise
        console.log(fruitsSet1.delete("banana")); // true
        console.log(fruitsSet1.delete("banana")); // false (already deleted)
        console.log(fruitsSet1.size);             // 3

        // 6. set.clear() – removes everything from the set
        fruitsSet1.clear();
        console.log(fruitsSet1.size);             // 0
        console.log(fruitsSet1.has("apple"));    // false

        // Iteration in Set

        let set1 = new Set(["oranges", "apples", "bananas"]);

        for (let value of set1) alert(value);

        // ----------------------------------------

        // the same with forEach:
        set1.forEach((value, valueAgain, setRef) => {
            alert(value);
        });

        // ----------------------------------------

        function checkSetSize(value, valueAgain, setRef) {
            if (setRef.size > 5) {
                console.log("This is a big set!");
            }
        }
        let smallSet = new Set([1, 2]);
        let bigSet = new Set([1, 2, 3, 4, 5, 6]);

        smallSet.forEach(checkSetSize); 
        bigSet.forEach(checkSetSize);

        // WeakMap and WeakSet

        // Allows only objects
        // Wont support clear, size, keys, values…
        // Auto-deleted with the original obj ref by garbage collector.
        // They have weak reference to objects, so they can easily be removed by garbage collector.

        let objt = { name: "John" };
        let wmap = new WeakMap();

        wmap.set(objt, "...");                       // allows only objt, str causes error
        objt = null; // overwrite the reference
        // objt is removed from memory

        alert(wmap.get(objt)); // undefined 

        // WeakSet

        let visitedSet = new WeakSet();
        let johnn = { name: "John" };
        let pete = { name: "Pete" };
        let mary = { name: "Mary" };

        visitedSet.add(johnn); // add John 
        visitedSet.add(pete); // add Pete
        visitedSet.add(johnn); // no effect 

        alert(visitedSet.has(johnn)); // true
        johnn = null;
        alert(visitedSet.has(johnn)); // false
        // visitedSet will be cleaned automatically
