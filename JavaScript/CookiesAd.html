<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cookies advanced</title>
</head>
<body>

<script>
// ==========================================
// 1. ADVANCED SECURITY & DOMAIN RULES
// ==========================================

// Secure & SameSite (Protection from hackers / XSRF)
// secure: Only works on HTTPS. 
// samesite=strict: Blocks cross-site requests.
document.cookie = "bank_token=12345; secure; samesite=strict";

// Domain (Sharing across subdomains)
// domain=site.com lets subdomains like forum.site.com read this cookie.
// document.cookie = "shared_user=John; domain=site.com"; 

// HttpOnly (Theory Note)
// If a server sets a cookie with 'httpOnly', JavaScript CANNOT read it. 
// It is completely invisible to document.cookie (protects against XSS attacks).


// ==========================================
// 2. PROFESSIONAL HELPER FUNCTIONS 
// ==========================================

// SETTER: Easily set cookies with any attributes using an object {}
function setCookie(name, value, attributes = {}) {
  attributes = { path: '/', ...attributes }; // Default path to '/'

  if (attributes.expires instanceof Date) {
    attributes.expires = attributes.expires.toUTCString();
  }

  let updatedCookie = encodeURIComponent(name) + "=" + encodeURIComponent(value);

  for (let attributeKey in attributes) {
    updatedCookie += "; " + attributeKey;
    let attributeValue = attributes[attributeKey];
    if (attributeValue !== true) {
      updatedCookie += "=" + attributeValue;
    }
  }
  document.cookie = updatedCookie;
}

// GETTER: Fast lookup using Regular Expressions
function getCookie(name) {
  let matches = document.cookie.match(new RegExp(
    "(?:^|; )" + name.replace(/([\.$?*|{}\(\)\[\]\\\/\+^])/g, '\\$1') + "=([^;]*)"
  ));
  return matches ? decodeURIComponent(matches[1]) : undefined;
}

// DELETER: Reuses setCookie but forces it to expire in the past (-1)
function deleteCookie(name) {
  setCookie(name, "", { 'max-age': -1 });
}


// ==========================================
// 3. TESTING THE PRO FUNCTIONS
// ==========================================

// 1. Set a cookie with multiple rules easily
setCookie('currency', 'USD', { secure: true, samesite: 'lax', 'max-age': 86400 });

// 2. Read it easily without manual splitting
console.log("Using Pro Getter (currency):", getCookie("currency")); 

// 3. Delete it easily
deleteCookie("currency");
console.log("After deletion (currency):", getCookie("currency")); // Output: undefined

</script>
</body>
</html>
