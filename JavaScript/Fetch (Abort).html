<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

<script>
    
    async function fetchWithTimeout() {
        const controller = new AbortController();
        // Abort the fetch automatically after 2 seconds
        const timeoutId = setTimeout(() => controller.abort(), 2000);
        try {
            // Pass the controller's signal into the fetch options
            const response = await fetch('https://jsonplaceholder.typicode.com/photos', {
                signal: controller.signal
            });
            const data = await response.json();
            console.log('Success:', data[0]);
        } catch (error) {
            if (error.name === 'AbortError') {
                console.error('The request took too long and was aborted.');
            } else {
                console.error('Standard network error:', error);
            }
        } finally {
            clearTimeout(timeoutId); // Prevent memory leaks
        }
    }
    fetchWithTimeout();
</script>
    
</body>
</html>
