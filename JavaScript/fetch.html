<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fetch</title>
</head>
<body>
    <script>
    
     fetch('https://jsonplaceholder.typicode.com/posts')
     .then(response => response.json())
     .then(data => {
        console.log(data);
    })
    .catch(error => {
        console.error('Error fetching data:', error);    
    });
            
    // async function 

    async function blob(){

        for (let i=1;i<=2;i++){
            try{
                let responce=await fetch(`https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${i}.png`);
                console.log('res:' + responce.status);

                if (!responce.ok){
                    throw new Error('network issue')
                }
                let data=await responce.blob();
                let obj=URL.createObjectURL(data);
                let a=document.createElement('img');
                a.src=obj;
                document.body.append(a);
            }
            catch(err){
                console.log('err:',err.message);
            }
        }
    }
    blob();
    </script>
</body>
</html>
