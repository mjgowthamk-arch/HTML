<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/images/login.png">

    <title>Login Form</title>

    <style>
    
    .logo {
      width: 200px;
      display: block;  /* Required for margin: auto; */
      margin: auto;     
    }

    .cont2 {
        background-color: lightgray;  
        padding: 80px;
        width: 300px;
        margin: auto;
    }

    </style>

</head>

<body>
    <div class="cont1">
        <img src="/images/login.png" class="logo" alt="Login Portal Logo">
    </div>


    <form action="" method="post">

        <div class="cont2">

            <label for="user">User name:</label>
            <input type="text" name="username" id="user" placeholder="Enter your user name" minlength="3" maxlength="20" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false" required>
            <br><br>

            <label for="pass">Password:</label>
            <input type="password" name="password" id="pass" minlength="6" placeholder="Enter your password" pattern="(?=.*\d)(?=.*[^A-Za-z0-9]).{6,}" title="Must be at least 6 characters and include at least 1 number and 1 symbol" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" required>
            <br><br>

            <label for="chbox">Remember me</label>
            <input type="checkbox" name="remember" id="chbox" value="remember-me">
            <br><br>
            
            <input type="submit" value="Log In">

        </div>

    </form>

</body>
</html>
