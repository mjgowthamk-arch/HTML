<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/images/login.png">
    <title>Login Form</title>
    <style>
    
    .logo {
      width: 200px;
      display: block;  /* Required for auto-margin */
      margin: auto;     
    }

    .cont2 {
        background-color: lightgray;
        
        padding: 100px;
        width: 500px;
        margin: auto;
    }

    </style>
</head>
<body>
    <div class="cont1">
        <img src="/images/login.png" class="logo">
    </div>


    <form action="">

        <div class="cont2">

            <label for="user">Enter your user name:</label>
            <input type="text" name="username" id="user">
            <br><br>

            <label for="pass">Enter your password:</label>
            <input type="password" name="password" id="pass">
            <br><br>

            <label for="chbox">Remember me</label>
            <input type="checkbox" name="checkbox" id="chbox">
            <br><br>
            
            <input type="submit" value="submit">

        </div>

    </form>

</body>
</html>
