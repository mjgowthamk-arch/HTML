<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table1</title>
</head>
<style>
    .table1 {
        width: 600px;
        border: 2px solid black;
        border-spacing: 3px;      
        text-align: center; 
        margin-top: 100px;
        margin: 100px auto 0; /* 100px Top, Auto Left/Right, 0 Bottom */
     
    }

    th, td , tr {
        border: 2px groove black;
        padding: 5px;
    }
</style>
<body>

    <div class="table">
    <table class="table1">

        <tr>
            <th rowspan="3">Day</th>
            <th colspan="3">Seminar</th>
        </tr>
      
        <tr>
            <th colspan="2">Schedule</th>
            <th rowspan="2">Topic</th>
        </tr>

        <tr>
            <th>Begin</th>
            <th>End</th>
        </tr>

        <tr>
            <td rowspan="2">Monday</td>
            <td rowspan="2">8:00 a.m.</td>
            <td rowspan="2">5:00 p.m.</td>
            <td>Introduction to XML</td>  
        </tr>

        <tr>
            <td>Validity: DTD and Relax NG</td>
        </tr>

        <tr>
            <td rowspan="3">Tuesday</td>
            <td>8:00 a.m.</td>
            <td>11:00 a.m.</td>
            <td rowspan="2">XPath</td>      
        </tr>

        <tr>
            <td>11:00 a.m.</td>
            <td>2:00 p.m.</td>
        </tr>

        <tr>
            <td>2:00 p.m.</td>
            <td>5:00 p.m.</td>
            <td>XSL Transformations</td>
        </tr>

        <tr>
            <td>Wednesday</td>
            <td>8:00 a.m.</td>
            <td>12:00 p.m.</td>
            <td>XSL Formatting Objects</td>      
        </tr>

    </table>
    </div>

</body>
</html>
