        <title>Flex box</title>

    .container {
        display: flex;
        background-color: blue;

    .container div {
        background-color: aliceblue;
        margin: 10px;
        font-size: 30px;
        padding: 20px;
    }

    </style>

    <body>

            <div>element 3</div>
            <div>element 4</div>
        </div>
    </body>
</html>
